services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - APP_ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      # Notion (asset register)
      - NOTION_ASSET_SYNC_ENABLED=${NOTION_ASSET_SYNC_ENABLED:-false}
      - NOTION_INTEGRATION_TOKEN=${NOTION_INTEGRATION_TOKEN:-}
      - NOTION_ASSET_DATABASE_ID=${NOTION_ASSET_DATABASE_ID:-}
      - NOTION_ASSET_PLANT_UID_FIELD=${NOTION_ASSET_PLANT_UID_FIELD:-Plant UID}
      - NOTION_ASSET_ALIAS_FIELD=${NOTION_ASSET_ALIAS_FIELD:-Alias}
      - NOTION_ASSET_CACHE_TTL_SECONDS=${NOTION_ASSET_CACHE_TTL_SECONDS:-300}
      # Back-compat names used by repo scripts/workflows
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - NOTION_DB_ID=${NOTION_DB_ID:-}
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    command: >
      streamlit run app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.runOnSave=true
      --server.fileWatcherType=auto
