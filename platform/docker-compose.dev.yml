services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - APP_ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    command: >
      streamlit run app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.runOnSave=true
      --server.fileWatcherType=auto
