name: Weekly Export Limit Check

on:
  # Run every Sunday at 10 PM UTC (after the main data pull)
  schedule:
    - cron: '0 22 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD), defaults to 7 days ago'
        required: false
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD), defaults to today'
        required: false
        type: string

jobs:
  export-limit-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Calculate date range
        id: dates
        run: |
          if [ -n "${{ inputs.start_date }}" ]; then
            echo "start=${{ inputs.start_date }}" >> $GITHUB_OUTPUT
          else
            echo "start=$(date -d '7 days ago' +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "${{ inputs.end_date }}" ]; then
            echo "end=${{ inputs.end_date }}" >> $GITHUB_OUTPUT
          else
            echo "end=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi
      
      - name: Run export limit check
        env:
          EMIG_API_KEY: ${{ secrets.EMIG_API_KEY }}
          JUGGLE_API_KEY: ${{ secrets.JUGGLE_API_KEY }}
          JUGGLE_APIKEY: ${{ secrets.JUGGLE_API_KEY }}
        run: |
          python scripts/export_limit_historic_pull.py \
            --start ${{ steps.dates.outputs.start }} \
            --end ${{ steps.dates.outputs.end }}
      
      - name: Check for curtailment alerts
        env:
          JUGGLE_APIKEY: ${{ secrets.JUGGLE_API_KEY }}
        run: |
          echo "📊 Current Curtailment Status:"
          cd "Solar Toolkit" && python -c "
          from export_limit_crawler import get_curtailed_sites
          curtailed = get_curtailed_sites()
          if curtailed:
              print('⚠️  ALERT: Sites currently curtailed:')
              for s in curtailed:
                  print(f'   - {s.plant_name}: {s.current_limit_pct}% (losing {s.curtailed_power_kw or 0:.1f} kW)')
          else:
              print('✅ No sites currently curtailed')
          "
      
      - name: Upload export limit data
        uses: actions/upload-artifact@v4
        with:
          name: export-limit-data-${{ steps.dates.outputs.start }}-to-${{ steps.dates.outputs.end }}
          path: |
            data/export_limits/*.parquet
            data/export_limits/*.csv
          retention-days: 30
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-limit-logs
          path: |
            *.log
          retention-days: 7
