[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-platform"
version = "1.1.0"
description = "Solar portfolio management platform"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pandas~=2.3",
    "numpy~=2.4",
    "python-dotenv~=1.2",
    "requests~=2.32",
    "pydantic~=2.12",
    "structlog~=25.5",
    "duckdb~=1.4",
    "python-dateutil~=2.9",
    "pytz~=2025.2",
    # Solar / scientific
    "pvlib~=0.13",
    "scipy~=1.16",
    # Data export
    "pyarrow~=22.0",
    "fastparquet~=2025.12",
    "openpyxl~=3.1",
    # Security
    "bcrypt>=4.0.0",
    "cryptography~=46.0",
    "PyJWT~=2.10",
]

[project.optional-dependencies]
ui = [
    "streamlit~=1.52",
    "plotly~=6.5",
    "kaleido~=1.2",
    "matplotlib~=3.10",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
all = [
    "solar-platform[ui,api,dev]",
]

[project.scripts]
solar-app = "app.main:run"
solar-api = "api.main:serve"
solar-pull = "cli.data_pull:main"
solar-backfill = "cli.backfill:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["solar_platform*", "app*", "api*", "cli*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "archive",
    "platform",
    "Solar Toolkit",
    "Monthly reporting",
    "legacy_extracts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "integration: Integration tests against real DuckDB",
    "e2e: End-to-end tests covering full workflows",
]
