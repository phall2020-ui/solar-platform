name: Site Onboarding to O&M Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types:
      - site_onboarding_submitted
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no writes)'
        required: false
        default: 'false'
      limit:
        description: 'Optional max sites to process'
        required: false
        default: ''
      page_id:
        description: 'Optional onboarding page ID (from webhook payload)'
        required: false
        default: ''

concurrency:
  group: site-onboarding-om-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Source: https://www.notion.so/91e9d443817d4a7982335d179b222645
      # Use Notion database IDs (page IDs) for /v1/databases endpoints.
      ONBOARDING_DB_ID: bd47f0ec-8aa7-4f45-9908-accdf882e4eb
      OM_CONTRACTS_DB_ID: 7dc7ccc4-5c5a-43d7-a75b-2e97818089dc
      OM_BILLING_DB_ID: 39212e37-c38b-4c79-b1cd-8e54c976f7ea

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate required secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NOTION_TOKEN:-}" ]; then
            echo "::error::Missing required secret: NOTION_TOKEN"
            exit 1
          fi

      - name: Verify Notion DB access
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("NOTION_TOKEN", "")
          db_ids = [
              os.environ.get("ONBOARDING_DB_ID", "").strip(),
              os.environ.get("OM_CONTRACTS_DB_ID", "").strip(),
              os.environ.get("OM_BILLING_DB_ID", "").strip(),
          ]

          if not token or not all(db_ids):
            raise SystemExit("Missing NOTION_TOKEN and/or Notion DB IDs")

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2022-06-28",
          }

          for db_id in db_ids:
            resp = requests.get(f"https://api.notion.com/v1/databases/{db_id}", headers=headers, timeout=30)
            if resp.status_code != 200:
              print(f"Notion DB access FAILED for {db_id} ({resp.status_code}): {resp.text[:500]}")
              print("If this is object_not_found, share the databases with the Notion integration behind NOTION_TOKEN.")
              raise SystemExit(1)

          print("Notion DB access OK")
          PY

      - name: Run onboarding sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || '' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '' }}
          INPUT_PAGE_ID: ${{ github.event.inputs.page_id || '' }}
          PAYLOAD_DRY_RUN: ${{ github.event.client_payload.dry_run || '' }}
          PAYLOAD_LIMIT: ${{ github.event.client_payload.limit || '' }}
          PAYLOAD_PAGE_ID: ${{ github.event.client_payload.page_id || '' }}
        run: |
          set -euo pipefail
          ARGS=()

          DRY_RUN="${INPUT_DRY_RUN:-${PAYLOAD_DRY_RUN:-false}}"
          LIMIT="${INPUT_LIMIT:-${PAYLOAD_LIMIT:-}}"
          PAGE_ID="${INPUT_PAGE_ID:-${PAYLOAD_PAGE_ID:-}}"

          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ -n "${LIMIT}" ]; then
            ARGS+=(--limit "${LIMIT}")
          fi

          if [ -n "${PAGE_ID}" ]; then
            ARGS+=(--page-id "${PAGE_ID}")
          fi

          python3 tools/inverter-data-juggle/onboard_to_om.py "${ARGS[@]}"
