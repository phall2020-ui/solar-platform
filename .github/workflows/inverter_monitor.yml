name: Inverter Monitor

on:
  schedule:
    - cron: '0 * * * *'  # Hourly (solar-gated inside the job)
  push:
    branches:
      - main
    paths:
      - 'jobs/inverter-daily-checks/**'
  workflow_dispatch:  # Manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs/inverter-daily-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: jobs/inverter-daily-checks/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Solar Schedule Check
        id: solar_check
        run: python inverter_monitor.py --solar-check
        continue-on-error: true

      - name: Setup Google Drive Credentials
        if: steps.solar_check.outcome == 'success' || github.event_name != 'schedule'
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          if [ -n "$GDRIVE_CREDENTIALS" ]; then
            echo "$GDRIVE_CREDENTIALS" > credentials.json
          fi
          if [ -n "$GDRIVE_TOKEN" ]; then
            echo "$GDRIVE_TOKEN" > token.json
          fi

      - name: Run monitor
        if: steps.solar_check.outcome == 'success' || github.event_name != 'schedule'
        env:
          IM__PLATFORMS__SOLAREDGE_BROWSER__ENABLED: true
          IM__PLATFORMS__SOLAREDGE_BROWSER__USERNAME: ${{ secrets.SOLAREDGE_USER }}
          IM__PLATFORMS__SOLAREDGE_BROWSER__PASSWORD: ${{ secrets.SOLAREDGE_PASS }}
          IM__PLATFORMS__SOLIS__ENABLED: true
          IM__PLATFORMS__SOLIS__API_ID: ${{ secrets.SOLIS_API_ID }}
          IM__PLATFORMS__SOLIS__API_SECRET: ${{ secrets.SOLIS_API_SECRET }}
          IM__PLATFORMS__SUNGROW_BROWSER__ENABLED: true
          IM__PLATFORMS__SUNGROW_BROWSER__USERNAME: ${{ secrets.SUNGROW_USER }}
          IM__PLATFORMS__SUNGROW_BROWSER__PASSWORD: ${{ secrets.SUNGROW_PASS }}
          IM__GOOGLE_DRIVE__ENABLED: true
          IM__GOOGLE_DRIVE__FOLDER_ID: "1Lo8dMjnDarMgYmkUBFoEEPRHWWZX-AkA"
          IM__NOTIFICATIONS__ENABLED: true
          IM__NOTIFICATIONS__NTFY__ENABLED: true
          IM__NOTIFICATIONS__NTFY__TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python inverter_monitor.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: jobs/inverter-daily-checks/reports/
