name: Test Schedule Automation

on:
  schedule:
    # Run every 15 minutes for testing purposes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  test-sync-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Secrets
        env:
          REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$REPO_DISPATCH_TOKEN" ]; then
            echo "::error::REPO_DISPATCH_TOKEN is missing"
            exit 1
          fi
          echo "Secrets validated."

      - name: Trigger Point Lane nightly sync (Test)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: phall2020-ui/experimental-repo
          event-type: test-schedule-sync
          client-payload: '{"test": "true", "source": "test_schedule_automation"}'
