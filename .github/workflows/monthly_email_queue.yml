name: Monthly Email Queue

on:
  # Runs on the first 3 days of the month to cover month-close grace period.
  # It will create the PROD queue page once; subsequent runs will no-op if it already exists.
  schedule:
    - cron: "30 6 1-3 * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type for the queued page"
        required: true
        default: "TEST"
        type: choice
        options:
          - TEST
          - PROD
      status:
        description: "Notion Status value to set on the queued page"
        required: true
        # Note: "Ready to send" will be picked up by downstream automation.
        default: "Ready to send"
      month:
        description: "Target month (YYYY-MM). Leave blank for previous month."
        required: false
        default: ""
      top_n:
        description: "Top N outliers to include"
        required: false
        default: "5"
      recipients:
        description: "Comma-separated recipient emails (optional; falls back to secret MONTHLY_EMAIL_RECIPIENTS)"
        required: false
        default: ""
      overwrite_existing:
        description: "Overwrite an existing page for that month/run_type if present (true/false)"
        required: false
        default: "false"

jobs:
  queue-monthly-email:
    runs-on: ubuntu-latest
    env:
      # Comparison DB (daily sync target).
      # Source: https://www.notion.so/3041773a96c08150b90ed65a266ee6a7
      COMPARISON_DB_ID: 3041773a-96c0-8150-b90e-d65a266ee6a7
      # Email queue DB.
      # Source: https://www.notion.so/3061773a96c081cfa9a0f9aa521b70ea
      QUEUE_DB_ID: 3061773a-96c0-81cf-a9a0-f9aa521b70ea

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate required secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MONTHLY_EMAIL_RECIPIENTS: ${{ secrets.MONTHLY_EMAIL_RECIPIENTS }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${NOTION_TOKEN:-}" ]; then
            missing+=("NOTION_TOKEN")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ -z "${MONTHLY_EMAIL_RECIPIENTS:-}" ]; then
            missing+=("MONTHLY_EMAIL_RECIPIENTS (required for scheduled runs)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Verify Notion DB Access
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("NOTION_TOKEN", "")
          comp_db = os.environ.get("COMPARISON_DB_ID", "")
          queue_db = os.environ.get("QUEUE_DB_ID", "")
          if not token or not comp_db or not queue_db:
            raise SystemExit("Missing NOTION_TOKEN/COMPARISON_DB_ID/QUEUE_DB_ID")

          headers = {
            "Authorization": f"Bearer {token}",
            "Notion-Version": "2022-06-28",
          }
          for db_id in (comp_db, queue_db):
            r = requests.get(f"https://api.notion.com/v1/databases/{db_id}", headers=headers, timeout=30)
            if r.status_code != 200:
              print(f"Notion DB access FAILED for {db_id} ({r.status_code}): {r.text[:500]}")
              print("If this is object_not_found, share the database with your Notion integration used by NOTION_TOKEN.")
              raise SystemExit(1)
          print("Notion DB access OK")
          PY

      - name: Create/Update Queue Page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MONTHLY_EMAIL_RECIPIENTS: ${{ secrets.MONTHLY_EMAIL_RECIPIENTS }}
        run: |
          set -euo pipefail

          # Scheduled runs always create the PROD page and set it ready for the downstream sender.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            RUN_TYPE="PROD"
            STATUS="Ready to send"
            TOP_N="5"
            MONTH=""
            RECIPIENTS="${MONTHLY_EMAIL_RECIPIENTS}"
            OVERWRITE="false"
          else
            RUN_TYPE="${{ inputs.run_type }}"
            STATUS="${{ inputs.status }}"
            TOP_N="${{ inputs.top_n }}"
            MONTH="${{ inputs.month }}"
            RECIPIENTS="${{ inputs.recipients }}"
            OVERWRITE="${{ inputs.overwrite_existing }}"
            if [ -z "${RECIPIENTS}" ]; then
              RECIPIENTS="${MONTHLY_EMAIL_RECIPIENTS}"
            fi
          fi

          if [ -z "${RECIPIENTS}" ]; then
            echo "::error::Missing recipients. Provide workflow input 'recipients' or set secret MONTHLY_EMAIL_RECIPIENTS."
            exit 1
          fi

          ARGS=(
            --run-type "${RUN_TYPE}"
            --status "${STATUS}"
            --top-n "${TOP_N}"
            --recipients "${RECIPIENTS}"
            --comparison-db-id "${COMPARISON_DB_ID}"
            --queue-db-id "${QUEUE_DB_ID}"
          )

          if [ -n "${MONTH}" ]; then
            ARGS+=(--month "${MONTH}")
          fi

          if [ "${OVERWRITE}" = "true" ]; then
            ARGS+=(--overwrite-existing)
          fi

          python3 tools/inverter-data-juggle/monthly_email_queue.py "${ARGS[@]}"
