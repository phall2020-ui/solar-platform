name: Daily Email Queue

on:
  # Trigger automatically after the daily sync completes successfully.
  workflow_run:
    workflows: ["Daily Notion Pull"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type for the queued page"
        required: true
        default: "TEST"
        type: choice
        options:
          - TEST
          - PROD
      date:
        description: "Report date (YYYY-MM-DD). Leave blank for previous day."
        required: false
        default: ""
      recipients:
        description: "Comma-separated recipients (optional; falls back to DAILY_EMAIL_RECIPIENTS then MONTHLY_EMAIL_RECIPIENTS)"
        required: false
        default: ""
      overwrite_existing:
        description: "Overwrite an existing page if present (true/false)"
        required: false
        default: "false"

jobs:
  queue-daily-email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == 'main'
      )
    env:
      # Comparison DB (daily sync target).
      # Source: https://www.notion.so/3041773a96c08150b90ed65a266ee6a7
      COMPARISON_DB_ID: 3041773a-96c0-8150-b90e-d65a266ee6a7
      # Email queue DB.
      # Source: https://www.notion.so/3061773a96c081cfa9a0f9aa521b70ea
      QUEUE_DB_ID: 3061773a-96c0-81cf-a9a0-f9aa521b70ea

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate required secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DAILY_EMAIL_RECIPIENTS: ${{ secrets.DAILY_EMAIL_RECIPIENTS }}
          MONTHLY_EMAIL_RECIPIENTS: ${{ secrets.MONTHLY_EMAIL_RECIPIENTS }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${NOTION_TOKEN:-}" ]; then
            missing+=("NOTION_TOKEN")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ -z "${DAILY_EMAIL_RECIPIENTS:-}" ] && [ -z "${MONTHLY_EMAIL_RECIPIENTS:-}" ]; then
            missing+=("DAILY_EMAIL_RECIPIENTS or MONTHLY_EMAIL_RECIPIENTS (required for automatic runs)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Verify Notion DB Access
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("NOTION_TOKEN", "")
          comp_db = os.environ.get("COMPARISON_DB_ID", "")
          queue_db = os.environ.get("QUEUE_DB_ID", "")
          if not token or not comp_db or not queue_db:
            raise SystemExit("Missing NOTION_TOKEN/COMPARISON_DB_ID/QUEUE_DB_ID")

          headers = {
            "Authorization": f"Bearer {token}",
            "Notion-Version": "2022-06-28",
          }
          for db_id in (comp_db, queue_db):
            r = requests.get(f"https://api.notion.com/v1/databases/{db_id}", headers=headers, timeout=30)
            if r.status_code != 200:
              print(f"Notion DB access FAILED for {db_id} ({r.status_code}): {r.text[:500]}")
              print("If this is object_not_found, share the database with your Notion integration used by NOTION_TOKEN.")
              raise SystemExit(1)
          print("Notion DB access OK")
          PY

      - name: Create/Update Queue Page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DAILY_EMAIL_RECIPIENTS: ${{ secrets.DAILY_EMAIL_RECIPIENTS }}
          MONTHLY_EMAIL_RECIPIENTS: ${{ secrets.MONTHLY_EMAIL_RECIPIENTS }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            RUN_TYPE="PROD"
            REPORT_DATE=""
            RECIPIENTS="${DAILY_EMAIL_RECIPIENTS}"
            if [ -z "${RECIPIENTS}" ]; then
              RECIPIENTS="${MONTHLY_EMAIL_RECIPIENTS}"
            fi
            OVERWRITE="false"
          else
            RUN_TYPE="${{ inputs.run_type }}"
            REPORT_DATE="${{ inputs.date }}"
            RECIPIENTS="${{ inputs.recipients }}"
            OVERWRITE="${{ inputs.overwrite_existing }}"
            if [ -z "${RECIPIENTS}" ]; then
              RECIPIENTS="${DAILY_EMAIL_RECIPIENTS}"
            fi
            if [ -z "${RECIPIENTS}" ]; then
              RECIPIENTS="${MONTHLY_EMAIL_RECIPIENTS}"
            fi
          fi

          if [ -z "${RECIPIENTS}" ]; then
            echo "::error::Missing recipients. Provide workflow input 'recipients' or set secret DAILY_EMAIL_RECIPIENTS/MONTHLY_EMAIL_RECIPIENTS."
            exit 1
          fi

          ARGS=(
            --run-type "${RUN_TYPE}"
            --recipients "${RECIPIENTS}"
            --comparison-db-id "${COMPARISON_DB_ID}"
            --queue-db-id "${QUEUE_DB_ID}"
          )

          if [ -n "${REPORT_DATE}" ]; then
            ARGS+=(--date "${REPORT_DATE}")
          fi

          if [ "${OVERWRITE}" = "true" ]; then
            ARGS+=(--overwrite-existing)
          fi

          python3 tools/inverter-data-juggle/daily_email_queue.py "${ARGS[@]}"
