name: Copilot Asset Audit

on:
  workflow_dispatch:
    inputs:
      reference_date:
        description: "Reference date in YYYY-MM-DD. Yesterday is derived from this date."
        required: false
        default: ""
      asset_filter:
        description: "Optional case-insensitive asset filter."
        required: false
        default: ""
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/copilot_asset_audit.yml"
      - "tools/performance-intelligence-copilot/**"
      - "src/solar_platform/services/performance_copilot_asset_audit.py"
      - "src/solar_platform/integrations/notion_assets.py"
      - "src/solar_platform/integrations/2026-02-15-Integrations-File-Notion-Assets-v01.py"
      - "tests/test_performance_copilot_asset_audit.py"
      - "tests/2026-02-15-Tests-File-Test-Notion-Asset-Register-Service-v01.py"

concurrency:
  group: copilot-asset-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      NOTION_ASSET_SYNC_ENABLED: "true"
      NOTION_TOKEN: ${{ secrets.NOTION_ASSET_REGISTER_TOKEN }}
      NOTION_DB_ID: ${{ secrets.NOTION_ASSET_REGISTER_DB_ID }}
      JUGGLE_API_KEY: ${{ secrets.JUGGLE_API_KEY }}
      SOLIS_API_URL: ${{ secrets.SOLIS_API_URL }}
      SOLIS_KEY_ID: ${{ secrets.SOLIS_KEY_ID }}
      SOLIS_KEY_SECRET: ${{ secrets.SOLIS_KEY_SECRET }}
      SOLAREDGE_KEYS_JSON: ${{ secrets.SOLAREDGE_KEYS_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OUTPUT_DIR: ${{ github.workspace }}/tools/performance-intelligence-copilot/output
      REFERENCE_DATE: ${{ inputs.reference_date }}
      ASSET_FILTER: ${{ inputs.asset_filter }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas \
            requests \
            httpx \
            openpyxl \
            pvlib \
            scipy \
            pydantic \
            pydantic-settings \
            python-dotenv \
            python-dateutil \
            pytz \
            structlog \
            duckdb \
            pyarrow \
            fastparquet \
            bcrypt \
            cryptography \
            PyJWT \
            openai \
            pytest \
            tenacity

      - name: Validate required secrets
        run: |
          missing=()
          for name in NOTION_TOKEN NOTION_DB_ID JUGGLE_API_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Backfill Data Source Match
        run: |
          mkdir -p "$OUTPUT_DIR"
          python tools/performance-intelligence-copilot/main.py \
            --mode asset-register-backfill \
            --force-refresh > "$OUTPUT_DIR/backfill_summary.json"

      - name: Run asset audit
        run: |
          mkdir -p "$OUTPUT_DIR"
          args=(tools/performance-intelligence-copilot/main.py --mode asset-register-yesterday --output-dir "$OUTPUT_DIR" --force-refresh)
          if [ -n "$REFERENCE_DATE" ]; then
            args+=(--reference-date "$REFERENCE_DATE")
          fi
          if [ -n "$ASSET_FILTER" ]; then
            args+=(--asset-filter "$ASSET_FILTER")
          fi
          python "${args[@]}"

      - name: Publish triage output to Notion
        run: |
          args=(tools/performance-intelligence-copilot/main.py --mode asset-register-publish-triage --output-dir "$OUTPUT_DIR" --force-refresh)
          if [ -n "$REFERENCE_DATE" ]; then
            args+=(--reference-date "$REFERENCE_DATE")
          fi
          if [ -n "$ASSET_FILTER" ]; then
            args+=(--asset-filter "$ASSET_FILTER")
          fi
          python "${args[@]}" > "$OUTPUT_DIR/triage_publish_summary.txt"

      - name: Build workflow summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_json_loose(path: Path):
              raw = path.read_text(encoding="utf-8")
              try:
                  return json.loads(raw)
              except json.JSONDecodeError:
                  start = raw.find("{")
                  end = raw.rfind("}")
                  if start != -1 and end != -1 and end > start:
                      return json.loads(raw[start:end + 1])
                  raise

          output_dir = Path(os.environ["OUTPUT_DIR"])
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          datasets = sorted(output_dir.glob("asset_yesterday_dataset_*.json"))
          if not datasets:
              raise SystemExit("No dataset JSON file found")

          dataset_path = datasets[-1]
          dataset = json.loads(dataset_path.read_text(encoding="utf-8"))
          backfill_path = output_dir / "backfill_summary.json"
          backfill = load_json_loose(backfill_path) if backfill_path.exists() else {}

          sources = ("juggle", "solaredge", "solis", "enphase", "huawei", "sma")
          resolved = sum(1 for row in dataset if row.get("match_method") != "unresolved")
          with_data = sum(1 for row in dataset if row.get("has_any_data"))

          lines = [
              "# Copilot Asset Audit",
              "",
              f"- Assets audited: {len(dataset)}",
              f"- Assets resolved: {resolved}",
              f"- Assets with data: {with_data}",
          ]
          if backfill:
              lines.extend(
                  [
                      f"- Backfill updated: {len(backfill.get('updated', []))}",
                      f"- Backfill unchanged: {len(backfill.get('unchanged', []))}",
                      f"- Backfill missing assets: {len(backfill.get('missing_assets', []))}",
                  ]
              )

          lines.append("")
          lines.append("## Source Status Counts")
          lines.append("")
          for source in sources:
              counts = {}
              for row in dataset:
                  status = row.get(f"{source}_status", "unknown")
                  counts[status] = counts.get(status, 0) + 1
              lines.append(f"- {source}: {counts}")

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copilot-asset-audit-${{ github.run_id }}
          path: |
            tools/performance-intelligence-copilot/output/*.json
            tools/performance-intelligence-copilot/output/*.csv
            tools/performance-intelligence-copilot/output/*.txt
          if-no-files-found: error
          retention-days: 14
