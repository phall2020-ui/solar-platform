name: Daily Notion Pull

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: false
        default: 'auto'
      send_email_summary:
        description: 'Send summary email at end of run'
        required: false
        default: 'false'

concurrency:
  group: daily-notion-pull
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/inverter-data-juggle

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Validate required secrets
        env:
          JUGGLE_API_KEY: ${{ secrets.JUGGLE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: |
          missing=()
          if [ -z "$JUGGLE_API_KEY" ]; then
            missing+=("JUGGLE_API_KEY")
          fi
          if [ -z "$NOTION_TOKEN" ]; then
            missing+=("NOTION_TOKEN")
          fi
          if [ -z "$NOTION_DB_ID" ] && [ -z "$NOTION_PAGE_ID" ]; then
            missing+=("NOTION_DB_ID or NOTION_PAGE_ID")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run Notion Sync
        env:
          JUGGLE_API_KEY: ${{ secrets.JUGGLE_API_KEY }}
          SOLIS_API_URL: ${{ secrets.SOLIS_API_URL }}
          SOLIS_KEY_ID: ${{ secrets.SOLIS_KEY_ID }}
          SOLIS_KEY_SECRET: ${{ secrets.SOLIS_KEY_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          SOLAREDGE_KEYS_JSON: ${{ secrets.SOLAREDGE_KEYS_JSON }}
          SYNC_SMTP_SERVER: ${{ secrets.SYNC_SMTP_SERVER }}
          SYNC_SMTP_PORT: ${{ secrets.SYNC_SMTP_PORT }}
          SYNC_SMTP_USERNAME: ${{ secrets.SYNC_SMTP_USERNAME }}
          SYNC_SMTP_PASSWORD: ${{ secrets.SYNC_SMTP_PASSWORD }}
          SYNC_SMTP_USE_TLS: ${{ secrets.SYNC_SMTP_USE_TLS }}
          SYNC_EMAIL_FROM: ${{ secrets.SYNC_EMAIL_FROM }}
          SYNC_EMAIL_TO: ${{ secrets.SYNC_EMAIL_TO }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          EXTRA_ARGS="--mode ${MODE}"

          SEND_EMAIL_INPUT="${{ github.event.inputs.send_email_summary || 'false' }}"
          if [ "$SEND_EMAIL_INPUT" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --send-email-summary"
          elif [ "$(date -u +%d)" = "01" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --send-email-summary"
          fi

          python notion_sync.py $EXTRA_ARGS
