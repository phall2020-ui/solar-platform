name: Daily Notion Pull

on:
  schedule:
    # GitHub schedules are UTC; run at both 03:00 and 04:00 UTC,
    # then gate to exactly 04:00 Europe/London to handle DST.
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: false
        default: 'auto'
      send_email_summary:
        description: 'Send summary email at end of run'
        required: false
        default: 'false'
      force_dispatch:
        description: 'Force trigger the Point Lane dispatch even without a successful sync'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: daily-notion-pull
  cancel-in-progress: false

jobs:
  # ── Gate job ────────────────────────────────────────────────────
  # For scheduled runs only one of the two UTC crons will match
  # UK 04:00 (the other fires during DST).  When the gate fails
  # the downstream sync-data job is *skipped*, so its conclusion
  # is never "success" and workflow_run listeners won't trigger.
  uk-time-gate:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || true
    outputs:
      should_run: ${{ steps.gate.outputs.run }}
    steps:
      - name: UK 4am gate (DST-aware)
        id: gate
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-schedule trigger — proceeding."
            exit 0
          fi
          UK_HOUR="$(TZ=Europe/London date +%H)"
          if [ "${UK_HOUR}" = "04" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding: UK local time is 04:00."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: UK local time is ${UK_HOUR}:00 (not 04:00)."
            exit 0
          fi

  # ── Main sync job ──────────────────────────────────────────────
  sync-data:
    needs: uk-time-gate
    if: needs.uk-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/inverter-data-juggle
    env:
      # Target Notion database for the daily meter/inverter comparison rows.
      # Source: https://www.notion.so/3041773a96c08150b90ed65a266ee6a7
      NOTION_DB_ID: 3041773a-96c0-8150-b90e-d65a266ee6a7

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/inverter-data-juggle/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          JUGGLE_API_KEY: ${{ secrets.JUGGLE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          missing=()
          if [ -z "$JUGGLE_API_KEY" ]; then
            missing+=("JUGGLE_API_KEY")
          fi
          if [ -z "$NOTION_TOKEN" ]; then
            missing+=("NOTION_TOKEN")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Verify Notion DB Access
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("NOTION_TOKEN", "")
          db_id = os.environ.get("NOTION_DB_ID", "")
          if not token or not db_id:
            raise SystemExit("Missing NOTION_TOKEN or NOTION_DB_ID")

          headers = {
            "Authorization": f"Bearer {token}",
            "Notion-Version": "2022-06-28",
          }
          r = requests.get(f"https://api.notion.com/v1/databases/{db_id}", headers=headers, timeout=30)
          if r.status_code == 200:
            print(f"Notion DB access OK: {db_id}")
            raise SystemExit(0)
          print(f"Notion DB access FAILED ({r.status_code}): {r.text[:500]}")
          print("If this is object_not_found, share the database with your Notion integration used by NOTION_TOKEN.")
          raise SystemExit(1)
          PY

      - name: Run Notion Sync
        id: run-sync
        env:
          JUGGLE_API_KEY: ${{ secrets.JUGGLE_API_KEY }}
          SOLIS_API_URL: ${{ secrets.SOLIS_API_URL }}
          SOLIS_KEY_ID: ${{ secrets.SOLIS_KEY_ID }}
          SOLIS_KEY_SECRET: ${{ secrets.SOLIS_KEY_SECRET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          SOLAREDGE_KEYS_JSON: ${{ secrets.SOLAREDGE_KEYS_JSON }}
          SYNC_SMTP_SERVER: ${{ secrets.SYNC_SMTP_SERVER }}
          SYNC_SMTP_PORT: ${{ secrets.SYNC_SMTP_PORT }}
          SYNC_SMTP_USERNAME: ${{ secrets.SYNC_SMTP_USERNAME }}
          SYNC_SMTP_PASSWORD: ${{ secrets.SYNC_SMTP_PASSWORD }}
          SYNC_SMTP_USE_TLS: ${{ secrets.SYNC_SMTP_USE_TLS }}
          SYNC_EMAIL_FROM: ${{ secrets.SYNC_EMAIL_FROM }}
          SYNC_EMAIL_TO: ${{ secrets.SYNC_EMAIL_TO }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          DAY="$(date -u +%d | sed 's/^0//')"
          GRACE_DAYS="${SYNC_MONTH_CLOSE_GRACE_DAYS:-3}"

          SEND_EMAIL_INPUT="${{ github.event.inputs.send_email_summary || 'false' }}"
          EMAIL_ARGS=""
          if [ "$SEND_EMAIL_INPUT" = "true" ]; then
            EMAIL_ARGS="--send-email-summary"
          elif [ "$DAY" = "1" ]; then
            EMAIL_ARGS="--send-email-summary"
          fi

          run_sync() {
            # Month-close behavior:
            # - During the first GRACE_DAYS of a new month, we finalize the previous month.
            # - On days 2..GRACE_DAYS, we also sync current MTD so we don't miss early new-month days.
            if [ "$MODE" = "auto" ] && [ "$DAY" -le "$GRACE_DAYS" ]; then
              python notion_sync.py --mode previous_month $EMAIL_ARGS
              if [ "$DAY" -ge 2 ]; then
                python notion_sync.py --mode current_mtd
              fi
            else
              python notion_sync.py --mode "$MODE" $EMAIL_ARGS
            fi
          }

          SYNC_EXIT=0
          for attempt in 1 2 3; do
            run_sync && break
            SYNC_EXIT=$?
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed. Waiting 60s before retry..."
              sleep 60
            fi
          done
          if [ $SYNC_EXIT -ne 0 ]; then
            echo "::error::Notion sync failed after 3 attempts."
            exit $SYNC_EXIT
          fi

      - name: Upload sync snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-sync-snapshots
          path: tools/inverter-data-juggle/sync_snapshots/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Trigger Point Lane nightly sync
        id: dispatch
        if: always() && (steps.run-sync.outcome != 'skipped' || github.event.inputs.force_dispatch == 'true')
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: phall2020-ui/experimental-repo
          event-type: nightly-sync

      - name: Send failure notification
        if: failure()
        env:
          SYNC_SMTP_SERVER: ${{ secrets.SYNC_SMTP_SERVER }}
          SYNC_SMTP_PORT: ${{ secrets.SYNC_SMTP_PORT }}
          SYNC_SMTP_USERNAME: ${{ secrets.SYNC_SMTP_USERNAME }}
          SYNC_SMTP_PASSWORD: ${{ secrets.SYNC_SMTP_PASSWORD }}
          SYNC_EMAIL_FROM: ${{ secrets.SYNC_EMAIL_FROM }}
          SYNC_EMAIL_TO: ${{ secrets.SYNC_EMAIL_TO }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          smtp_server = os.environ.get("SYNC_SMTP_SERVER")
          smtp_port = int(os.environ.get("SYNC_SMTP_PORT", "587"))
          username = os.environ.get("SYNC_SMTP_USERNAME")
          password = os.environ.get("SYNC_SMTP_PASSWORD")
          from_email = os.environ.get("SYNC_EMAIL_FROM")
          to_emails = os.environ.get("SYNC_EMAIL_TO", "").split(",")

          if not all([smtp_server, username, password, from_email, to_emails]):
              print("Missing SMTP configuration. Cannot send failure alert.")
              exit(0)

          subject = f"❌ GitHub Action FAILURE: solar-platform Daily Sync ({datetime.now().strftime('%Y-%m-%d')})"
          body = f"The solar-platform Daily Notion Pull workflow has failed.\n\nRun URL: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}\n\nPlease check the logs for details."

          msg = MIMEMultipart()
          msg['Subject'] = subject
          msg['From'] = from_email
          msg['To'] = ", ".join(to_emails)
          msg.attach(MIMEText(body, 'plain'))

          context = ssl.create_default_context()
          try:
              with smtplib.SMTP(smtp_server, smtp_port) as server:
                  server.starttls(context=context)
                  server.login(username, password)
                  server.sendmail(from_email, to_emails, msg.as_string())
              print("Failure notification email sent.")
          except Exception as e:
              print(f"Failed to send email: {e}")
          PY

      - name: Write job summary
        if: always()
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          SYNC_OUTCOME="${{ steps.run-sync.outcome }}"
          DISPATCH_OUTCOME="${{ steps.dispatch.outcome }}"
          {
            echo "## Daily Notion Sync Summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Sync mode | \`$MODE\` |"
            echo "| Sync result | $SYNC_OUTCOME |"
            echo "| Point Lane dispatch | $DISPATCH_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"
