name: Weekly Email Queue

on:
  schedule:
    # Run at 03:00 and 04:00 UTC every Monday; UK-time gate picks 04:00 local.
    - cron: '0 3 * * 1'
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type for the queued page"
        required: true
        default: "TEST"
        type: choice
        options:
          - TEST
          - PROD
      week_start:
        description: "Monday of target week (YYYY-MM-DD). Leave blank for previous week."
        required: false
        default: ""
      recipients:
        description: "Comma-separated recipients (optional; falls back to secrets)"
        required: false
        default: ""
      overwrite_existing:
        description: "Overwrite an existing page if present (true/false)"
        required: false
        default: "false"

concurrency:
  group: weekly-email-queue
  cancel-in-progress: true

jobs:
  queue-weekly-email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'schedule' &&
        github.ref == 'refs/heads/main'
      )
    env:
      COMPARISON_DB_ID: 3041773a-96c0-8150-b90e-d65a266ee6a7
      QUEUE_DB_ID: 3061773a-96c0-81cf-a9a0-f9aa521b70ea

    steps:
      - name: UK 4am Monday gate (DST-aware)
        id: gate
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-schedule trigger — proceeding."
            exit 0
          fi
          UK_HOUR="$(TZ=Europe/London date +%H)"
          if [ "${UK_HOUR}" = "04" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding: UK local time is 04:00 on Monday."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: UK local time is ${UK_HOUR}:00 (not 04:00)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate required secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WEEKLY_EMAIL_RECIPIENTS: ${{ secrets.WEEKLY_EMAIL_RECIPIENTS }}
          DAILY_EMAIL_RECIPIENTS: ${{ secrets.DAILY_EMAIL_RECIPIENTS }}
          MONTHLY_EMAIL_RECIPIENTS: ${{ secrets.MONTHLY_EMAIL_RECIPIENTS }}
        run: |
          set -euo pipefail
          if [ -z "${NOTION_TOKEN:-}" ]; then
            echo "::error::Missing required secret: NOTION_TOKEN"
            exit 1
          fi
          if [ -z "${WEEKLY_EMAIL_RECIPIENTS:-}" ] && [ -z "${DAILY_EMAIL_RECIPIENTS:-}" ] && [ -z "${MONTHLY_EMAIL_RECIPIENTS:-}" ]; then
            echo "::error::Missing recipients secret (WEEKLY_EMAIL_RECIPIENTS, DAILY_EMAIL_RECIPIENTS, or MONTHLY_EMAIL_RECIPIENTS)"
            exit 1
          fi

      - name: Verify Notion DB Access
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("NOTION_TOKEN", "")
          comp_db = os.environ.get("COMPARISON_DB_ID", "")
          queue_db = os.environ.get("QUEUE_DB_ID", "")
          if not token or not comp_db or not queue_db:
            raise SystemExit("Missing NOTION_TOKEN/COMPARISON_DB_ID/QUEUE_DB_ID")

          headers = {
            "Authorization": f"Bearer {token}",
            "Notion-Version": "2022-06-28",
          }
          for db_id in (comp_db, queue_db):
            r = requests.get(f"https://api.notion.com/v1/databases/{db_id}", headers=headers, timeout=30)
            if r.status_code != 200:
              print(f"Notion DB access FAILED for {db_id} ({r.status_code}): {r.text[:500]}")
              raise SystemExit(1)
          print("Notion DB access OK")
          PY

      - name: Create/Update Weekly Queue Page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WEEKLY_EMAIL_RECIPIENTS: ${{ secrets.WEEKLY_EMAIL_RECIPIENTS }}
          DAILY_EMAIL_RECIPIENTS: ${{ secrets.DAILY_EMAIL_RECIPIENTS }}
          MONTHLY_EMAIL_RECIPIENTS: ${{ secrets.MONTHLY_EMAIL_RECIPIENTS }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            RUN_TYPE="PROD"
            WEEK_START=""
            RECIPIENTS="${WEEKLY_EMAIL_RECIPIENTS:-${DAILY_EMAIL_RECIPIENTS:-${MONTHLY_EMAIL_RECIPIENTS:-}}}"
            OVERWRITE="false"
          else
            RUN_TYPE="${{ inputs.run_type }}"
            WEEK_START="${{ inputs.week_start }}"
            RECIPIENTS="${{ inputs.recipients }}"
            OVERWRITE="${{ inputs.overwrite_existing }}"
            if [ -z "${RECIPIENTS}" ]; then
              RECIPIENTS="${WEEKLY_EMAIL_RECIPIENTS:-${DAILY_EMAIL_RECIPIENTS:-${MONTHLY_EMAIL_RECIPIENTS:-}}}"
            fi
          fi

          if [ -z "${RECIPIENTS}" ]; then
            echo "::error::Missing recipients."
            exit 1
          fi

          ARGS=(
            --run-type "${RUN_TYPE}"
            --recipients "${RECIPIENTS}"
            --comparison-db-id "${COMPARISON_DB_ID}"
            --queue-db-id "${QUEUE_DB_ID}"
          )

          if [ -n "${WEEK_START}" ]; then
            ARGS+=(--week-start "${WEEK_START}")
          fi

          if [ "${OVERWRITE}" = "true" ]; then
            ARGS+=(--overwrite-existing)
          fi

          python3 tools/inverter-data-juggle/weekly_email_queue.py "${ARGS[@]}"
