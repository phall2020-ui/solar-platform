name: Daily Inverter Data Pull

on:
  schedule:
    # Run at 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Validate required secrets
      env:
        JUGGLE_API_KEY: ${{ secrets.JUGGLE_API_KEY }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
      run: |
        missing=()

        if [ -z "$JUGGLE_API_KEY" ]; then
          missing+=("JUGGLE_API_KEY")
        fi
        if [ -z "$NOTION_TOKEN" ]; then
          missing+=("NOTION_TOKEN")
        fi
        if [ -z "$NOTION_DB_ID" ] && [ -z "$NOTION_PAGE_ID" ]; then
          missing+=("NOTION_DB_ID or NOTION_PAGE_ID")
        fi

        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Missing required secrets: ${missing[*]}"
          exit 1
        fi

    - name: Run Notion Sync
      env:
        JUGGLE_API_KEY: ${{ secrets.JUGGLE_API_KEY }}
        SOLIS_API_URL: ${{ secrets.SOLIS_API_URL }}
        SOLIS_KEY_ID: ${{ secrets.SOLIS_KEY_ID }}
        SOLIS_KEY_SECRET: ${{ secrets.SOLIS_KEY_SECRET }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        SOLAREDGE_KEYS_JSON: ${{ secrets.SOLAREDGE_KEYS_JSON }}
      run: python notion_sync.py
